[workspace]
resolver = "2"

members = [
    "codeview",
    "msf",
    "msfz",
    "pdb",
    "pdbtool",
]

[workspace.dependencies]
anyhow = "1.0.98"
bitfield = "0.19.1"
bitflags = "2.9.1"
bitvec = "1.0.1"
bstr = "1.12.0"
bumpalo = "3.19.0"
cc = "1.2.30"
clap = "4.5.41"
dbg-ranges = "0.1.1"
flate2 = "1.1.2"
pow2 = "0.1.1"
pretty-hex = "0.4.1"
static_assertions = "1.1.0"
static_init = "1.0.4"
sync_file = "0.3.0"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
tracing-tracy = "0.11.4"
uuid = "1.17.0"
zerocopy = "0.8.26"
zerocopy-derive = "0.8.26"
zstd = "0.13.3"

mspdb = { path = "mspdb" }

[profile.release]
debug = 2

# This compiles external packages with optimizations. Compression libraries
# especially sensitive to optimization. This makes it a lot easier to do
# development and run tests with local code in debug mode but external dependencies
# fully optimized.
[profile.dev.package."*"]
opt-level = 2

[profile.coverage]
inherits = "dev"
